<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vorax Learn</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- IMAGE -->
<img src="https://i.ibb.co/5q4y2MQ/IMG-20260629-WA0109.jpg" class="banner">

<h1>🎓 Vorax Learn</h1>
<p>Ton IA Prof pour réussir en 1ère A</p>

<!-- IA PROF -->
<section class="card">
<h2>👨‍🏫 IA Prof - Cours</h2>

<select id="matiere">
<option>Français</option>
<option>Anglais</option>
<option>Histoire-Géo</option>
</select>

<select id="typeCours">
<option>Introduction</option>
<option>Argument</option>
<option>Conclusion</option>
</select>

<button onclick="cours()">Voir le cours</button>

<p id="contenuCours"></p>
</section>

<!-- LEÇON -->
<section class="card">
<h2>🧠 Comprendre Argument & Exemple</h2>

<button onclick="lecon()">Voir la leçon</button>

<p id="lecon"></p>
</section>

<!-- TEST -->
<section class="card">
<h2>📝 Mode Test</h2>

<p id="sujet-test"><b>Sujet :</b> Clique pour commencer</p>

<button onclick="genererSujet()">Nouveau sujet</button>

<textarea id="copie" placeholder="Rédige ici..." rows="12"></textarea>

<button onclick="corrigerIA()">Corriger</button>

<p id="resultat"></p>
</section>

<script src="app.js"></script>

</body>
</html>
